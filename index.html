<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Definition Dictionary</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>:root{font-family:'DM Sans',system-ui,sans-serif;color:#172b33;background:#eef5f3}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:32px 16px;background:radial-gradient(circle at 10% 0,#d9f0e9 0,transparent 35%),#eef5f3}.app{max-width:820px;margin:auto;background:#fff;border:1px solid #d8e8e3;border-radius:24px;padding:32px;box-shadow:0 18px 60px #19483b16}.brand{text-align:left;margin:0 0 24px}.brand img{display:block;width:76px;height:76px;object-fit:contain;object-position:left center;margin:0 0 4px}.brand-name{font:700 1.15rem 'Space Grotesk',sans-serif;letter-spacing:.14em;color:#176b61}.brand-subtitle{font:600 1.65rem 'Space Grotesk',sans-serif;letter-spacing:-.03em;margin-top:8px;color:#172b33}h1{font:700 2rem 'Space Grotesk',sans-serif;letter-spacing:-.04em;margin:0}.subtitle{color:#65807b;margin:7px 0 24px}.form{display:grid;gap:11px;background:#f4f9f7;border:1px solid #e0eeea;border-radius:16px;padding:16px;margin-bottom:20px}input,textarea,select{width:100%;font:inherit;color:inherit;border:1px solid #cbded8;border-radius:11px;padding:12px 13px;background:#fff;outline:none}input:focus,textarea:focus,select:focus{border-color:#2c8d7b;box-shadow:0 0 0 3px #2c8d7b20}textarea{min-height:92px;resize:vertical}.form-row{display:grid;grid-template-columns:1fr 150px;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{font:600 .92rem inherit;border:0;border-radius:11px;padding:10px 15px;background:#187363;color:#fff;cursor:pointer}button:hover{filter:brightness(.96)}button.secondary{background:#e3f0ec;color:#1e5950}button.danger{background:#fff0ed;color:#a13d33}.toolbar{display:flex;align-items:center;gap:12px;margin:16px 0}.search{flex:1}.count{font-size:.84rem;color:#6c8580;white-space:nowrap}.entry{position:relative;border:1px solid #dbe9e5;border-left:5px solid var(--entry-color,#62aa9a);border-radius:15px;padding:17px 18px;margin:11px 0;background:#fff;box-shadow:0 5px 16px #174a3d09}.term{font:700 1.18rem 'Space Grotesk',sans-serif;margin-bottom:6px}.definition{white-space:pre-wrap;line-height:1.6;color:#425d5b}.meta{display:flex;gap:7px;margin-top:13px}.meta button{font-size:.82rem;padding:7px 10px}.empty{color:#718786;text-align:center;padding:38px 0;border:1px dashed #c8ddd7;border-radius:14px}.hint{font-size:.82rem;color:#78908c;margin:0}@media(max-width:600px){body{padding:12px}.app{padding:20px;border-radius:18px}.brand img{width:100px;height:100px}.brand-subtitle{font-size:1.3rem}.form-row{grid-template-columns:1fr}.toolbar{display:block}.count{display:block;margin-top:8px}}
</style></head><body><main class="app"><div class="brand"><img src="dlab-logo.png" alt="D Lab logo"><div class="brand-name">D–Lab</div><div class="brand-subtitle">Definition Dictionary</div></div><form class="form" id="entry-form"><input id="term" required placeholder="Term / keyword"><textarea id="definition" required placeholder="Write the definition…"></textarea><div class="form-row"><select id="color" aria-label="Entry color"><option value="#62aa9a">Mint</option><option value="#e5a34f">Amber</option><option value="#7b9be8">Blue</option><option value="#d77aa6">Rose</option><option value="#9b82d1">Purple</option></select><div class="actions"><button id="save" type="submit">Add definition</button><button class="secondary" id="cancel" type="button" hidden>Cancel</button></div></div><p class="hint">Your entries are saved automatically in this browser.</p></form>
<div class="toolbar"><input class="search" id="search" placeholder="Search terms and definitions…" aria-label="Search"><span class="count" id="count">0 definitions</span></div><section id="entries" aria-live="polite"></section></main>
<script>const KEY='definition-dictionary-v2';let entries=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('definition-dictionary-v1')||'[]'),editing=null;const $=id=>document.getElementById(id),form=$('entry-form'),term=$('term'),definition=$('definition'),color=$('color'),search=$('search'),list=$('entries'),save=$('save'),cancel=$('cancel'),count=$('count');function persist(){localStorage.setItem(KEY,JSON.stringify(entries));render()}function render(){const q=search.value.trim().toLowerCase(),shown=entries.filter(e=>(e.term+' '+e.definition).toLowerCase().includes(q)).sort((a,b)=>a.term.localeCompare(b.term));count.textContent=shown.length+' definition'+(shown.length===1?'':'s');list.innerHTML='';if(!shown.length){list.innerHTML='<div class="empty">No definitions yet.</div>';return}shown.forEach(e=>{const row=document.createElement('article');row.className='entry';row.style.setProperty('--entry-color',e.color||'#62aa9a');row.innerHTML='<div class="term"></div><div class="definition"></div><div class="meta"><button class="secondary edit">Edit</button><button class="danger delete">Delete</button></div>';row.querySelector('.term').textContent=e.term;row.querySelector('.definition').textContent=e.definition;row.querySelector('.edit').onclick=()=>startEdit(e.id);row.querySelector('.delete').onclick=()=>{if(confirm('Delete this definition?')){entries=entries.filter(x=>x.id!==e.id);persist()}};list.appendChild(row)})}form.onsubmit=e=>{e.preventDefault();const t=term.value.trim(),d=definition.value.trim();if(!t||!d)return;if(editing){const x=entries.find(x=>x.id===editing);x.term=t;x.definition=d;x.color=color.value}else entries.push({id:crypto.randomUUID(),term:t,definition:d,color:color.value});editing=null;term.value='';definition.value='';color.value='#62aa9a';save.textContent='Add definition';cancel.hidden=true;persist();term.focus()};function startEdit(id){const e=entries.find(x=>x.id===id);editing=id;term.value=e.term;definition.value=e.definition;color.value=e.color||'#62aa9a';save.textContent='Save changes';cancel.hidden=false;term.focus()}cancel.onclick=()=>{editing=null;term.value='';definition.value='';color.value='#62aa9a';save.textContent='Add definition';cancel.hidden=true};search.oninput=render;render();</script></body></html>
